name: sonarqube

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and sonarqube analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for accurate SonarQube analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies and generate coverage
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[keras3,test]"
          coverage run -m pytest tests/
          coverage xml

      - name: Sanitize SonarQube Secrets
        env:
          RAW_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RAW_SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarqube.gmrandazzo.com' }}
        run: |
          python -c '
          import os
          raw_token = os.environ.get("RAW_SONAR_TOKEN", "")
          raw_host = os.environ.get("RAW_SONAR_HOST_URL", "https://sonarqube.gmrandazzo.com")
          clean_token = "".join(raw_token.split())
          clean_host = "".join(raw_host.split())
          if clean_token:
              print(f"::add-mask::{clean_token}")
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"SONAR_TOKEN={clean_token}\n")
                  f.write(f"SONAR_HOST_URL={clean_host}\n")
          '

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.token=${{ env.SONAR_TOKEN }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
