name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  code-quality:
    name: 1. Code Quality & Linting
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: 2. Unit Tests & Coverage (${{ matrix.python-version }} - ${{ matrix.keras-target }})
    needs: code-quality
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            keras-target: "keras2"
          - python-version: "3.11"
            keras-target: "keras3"
          - python-version: "3.13"
            keras-target: "keras3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (${{ matrix.keras-target }})
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.keras-target }},test]"

      - name: Run test suite & generate coverage
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ] && [ "${{ matrix.keras-target }}" = "keras3" ]; then
            coverage run -m pytest tests/ -v
            coverage xml
          else
            pytest tests/ -v
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && matrix.keras-target == 'keras3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube:
    name: 3. SonarQube (Code & Security Analysis)
    needs: [code-quality, unit-tests]
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for accurate SonarQube analysis

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarqube.gmrandazzo.com' }}

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarqube.gmrandazzo.com' }}

  build:
    name: 4. Build Wheel & Source Distribution
    needs: [unit-tests, sonarqube]
    # Build package only on tagged releases (e.g., v0.2.0) or manual workflow dispatch
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution packages
        run: |
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: 5. Publish package to PyPI
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # Publish on tagged releases (e.g., v0.2.0) or manual workflow dispatch
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/deepmolecularnetwork
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing if configured
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
