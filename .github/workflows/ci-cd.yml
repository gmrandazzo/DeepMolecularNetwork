name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  pre-commit:
    name: Lint & Typecheck (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: Test (Python ${{ matrix.python-version }} - ${{ matrix.keras-target }})
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            keras-target: "keras2"
          - python-version: "3.11"
            keras-target: "keras3"
          - python-version: "3.13"
            keras-target: "keras3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (${{ matrix.keras-target }})
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.keras-target }},test]"

      - name: Run test suite
        run: |
          pytest tests/ -v

  build:
    name: Build Wheel & Source Distribution
    needs: pytest
    # Build package only on tagged releases (e.g., v0.2.0) or manual workflow dispatch
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution packages
        run: |
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publish on tagged releases (e.g., v0.2.0) or manual workflow dispatch
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/deepmolecularnetwork
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing if configured
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
