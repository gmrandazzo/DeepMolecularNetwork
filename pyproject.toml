[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmolecularnetwork"
version = "0.3.0"
description = "A deep learning framework for QSAR/QSPR modeling with 3D voxels, tabular descriptors, and molecular representations"
readme = "README.md"
authors = [
    { name = "Giuseppe Marco Randazzo", email = "gmrandazzo@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "h5py>=3.6.0",
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/gmrandazzo/DeepMolecularNetwork"
Repository = "https://github.com/gmrandazzo/DeepMolecularNetwork"
"Bug Tracker" = "https://github.com/gmrandazzo/DeepMolecularNetwork/issues"

[project.scripts]
dmn = "deepmolecularnetwork.cli:main"
deepmolecularnetwork = "deepmolecularnetwork.cli:main"

# Tabular modeling
dmn-makednndb = "deepmolecularnetwork.tabular.makeDNNDB:main"
dmn-maketabmodel = "deepmolecularnetwork.tabular.makeTABModel:main"
dmn-maketabprediction = "deepmolecularnetwork.tabular.makeTABPrediction:main"

# One-Hot Encoding & SMILES modeling
dmn-makeohedb = "deepmolecularnetwork.OneHotEncodingModeling.makeOHEDatabase:main"
dmn-makeohemodel = "deepmolecularnetwork.ohe.model:main"
dmn-makeoheprediction = "deepmolecularnetwork.ohe.predict:main"
dmn-ohepredict = "deepmolecularnetwork.ohe.predict:main"
dmn-smi2ohe = "deepmolecularnetwork.SMILESModeling.SMI2OHEMatrix:main"

# 3D Voxel modeling
dmn-makevoxeldb = "deepmolecularnetwork.voxels.database:main"
dmn-make3dcnnmodel = "deepmolecularnetwork.voxels.model:main"
dmn-make3dcnnprediction = "deepmolecularnetwork.voxels.predict:main"
dmn-makecsvdataset = "deepmolecularnetwork.voxels.make_csv_dataset:main"
dmn-smi2voxel = "deepmolecularnetwork.voxels.rdkit_voxelizer:main"

# 2D and 3D Visualization
dmn-img2dvis = "deepmolecularnetwork.images2d.visualize:main"
dmn-vis2dcnn = "deepmolecularnetwork.images2d.visualize:main"
dmn-vis3dcnn = "deepmolecularnetwork.voxels.visualize:main"

# Legacy script name aliases (for backward compatibility when installed via pip)
makeDNNDB = "deepmolecularnetwork.tabular.makeDNNDB:main"
makeTABModel = "deepmolecularnetwork.tabular.makeTABModel:main"
makeTABPrediction = "deepmolecularnetwork.tabular.makeTABPrediction:main"
makeOHEDatabase = "deepmolecularnetwork.OneHotEncodingModeling.makeOHEDatabase:main"
makeOHEModel = "deepmolecularnetwork.ohe.model:main"
makeOHEPrediction = "deepmolecularnetwork.ohe.predict:main"
SMI2OHEMatrix = "deepmolecularnetwork.SMILESModeling.SMI2OHEMatrix:main"
makeVoxelCNNDatabase = "deepmolecularnetwork.voxels.database:main"
make3DCNNModel = "deepmolecularnetwork.voxels.model:main"
make3DCNNPrediction = "deepmolecularnetwork.voxels.predict:main"
makeCSVDataset = "deepmolecularnetwork.voxels.make_csv_dataset:main"
visualize2DCNNLayer = "deepmolecularnetwork.images2d.visualize:main"
visualize3DConvNetLayers = "deepmolecularnetwork.voxels.visualize:main"

[project.optional-dependencies]
keras2 = [
    "numpy>=1.22.0,<2.0.0",
    "tensorflow-cpu>=2.13.0,<2.16.0",
    "keras>=2.13.0,<3.0.0",
    "tensorboard>=2.13.0",
]
keras3 = [
    "tensorflow-cpu>=2.16.0",
    "keras>=3.0.0",
    "tensorboard>=2.16.0",
]
chem = [
    "rdkit>=2023.9.1",
]
test = [
    "pytest>=7.0.0",
    "coverage>=6.0.0",
]
dev = [
    "deepmolecularnetwork[test]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepmolecularnetwork*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
